<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" color="#3B8FD9"><style>.lg-s,.lg-a{stroke-dasharray:1;stroke-dashoffset:0}
.lg-n,.lg-dot{transform-box:fill-box;transform-origin:center}
.lg-s{animation:lg-draw 5s ease-out infinite both}
.lg-n{animation:lg-pop 5s ease-out infinite both}
.lg-a{animation:lg-shoot 5s cubic-bezier(.3,.7,.2,1) infinite both}
.lg-a2{animation-delay:.18s}.lg-a3{animation-delay:.36s}
.lg-dot{animation:lg-pulse 1.25s ease-in-out infinite}
@keyframes lg-draw{0%{stroke-dashoffset:1;opacity:0}3%{opacity:1}20%{stroke-dashoffset:0}88%{opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes lg-pop{0%,18%{transform:scale(0);opacity:0}26%{transform:scale(1.25);opacity:1}31%{transform:scale(1)}88%{transform:scale(1);opacity:1}95%,100%{transform:scale(1);opacity:0}}
@keyframes lg-shoot{0%,30%{stroke-dashoffset:1;opacity:0}32%{opacity:1}52%{stroke-dashoffset:0}84%{opacity:1}92%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes lg-pulse{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.lg-s,.lg-n,.lg-a,.lg-dot{animation:none}}</style>
